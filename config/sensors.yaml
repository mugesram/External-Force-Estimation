# Sensor models for the Tier 0 simulator and the replay Monte Carlo. Defaults follow Pegasus' IMU and an RTK receiver.
imu_rate: 250.0
acc_noise_density: 0.004     # m/s^2/sqrt(Hz)
acc_bias_sigma: 0.196        # m/s^2, turn-on bias (Pegasus default)
acc_bias_rw: 0.006           # m/s^3/sqrt(Hz)
acc_bias_tau: 300.0          # s
acc_vibration: 0.15          # m/s^2, extra white noise from rotor vibration
gyro_noise_density: 0.00034  # rad/s/sqrt(Hz)
gyro_bias_sigma: 0.0087
gyro_bias_rw: 3.9e-5
gnss_rate: 10.0
gnss_pos_sigma: [0.02, 0.02, 0.03]
gnss_vel_sigma: 0.03
att_rate: 50.0               # vehicle_attitude over DDS
att_error_deg: 0.3           # attitude estimate error (Gauss-Markov)
att_error_tau: 2.0
bat_rate: 50.0
bat_noise: 0.05              # V
motor_rate: 250.0
motor_jitter: 0.01           # differential motor activity from the attitude controller
