# No external force at all: any F_hat is a fake force. Isolates the battery-sag effect.
duration: 120.0
trajectory:
  - {t: [0, 10], type: hold, pos: [0, 0, -3]}
  - {t: [10, 35], type: zsteps, pos: [0, 0, -3], amp: 0.5, period: 2.5}
  - {t: [35, 120], type: hold, pos: [0, 0, -3]}
forces: []
phases:
  hover: [3, 10]
  excitation: [10, 35]
  hover_sag: [35, 120]
